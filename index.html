<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gap</title>
<meta name="description" content="Gap — tus gastos, deudas y plan de dinero, en tu bolsillo.">
<meta name="theme-color" content="#110F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gap">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
// Genera el ícono PNG para la pantalla de inicio del iPhone
(function(){try{var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');
x.fillStyle='#110F1A';x.fillRect(0,0,180,180);var g=x.createLinearGradient(40,40,140,140);
g.addColorStop(0,'#A99BFF');g.addColorStop(1,'#C8F560');x.strokeStyle=g;x.lineWidth=21;x.lineCap='round';
x.beginPath();var s=-40*Math.PI/180;x.arc(90,90,53,s,s+Math.PI*2*0.74);x.stroke();
document.getElementById('ati').href=c.toDataURL('image/png');}catch(e){}})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i></div>

<main id="app">
  <header class="top">
    <div>
      <p class="hello" id="hello">Hola</p>
      <h1 id="screenTitle">Tu mes</h1>
    </div>
    <button class="icon-btn" id="btnSettings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <section class="view active" id="view-home"></section>
  <section class="view" id="view-debts"></section>
  <section class="view" id="view-plan"></section>
  <section class="view" id="view-ideas"></section>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="home" aria-label="Inicio">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg><span>Inicio</span>
  </button>
  <button class="tab" data-view="debts" aria-label="Deudas">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span>Deudas</span>
  </button>
  <button class="fab" id="fab" aria-label="Registrar movimiento">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="tab" data-view="plan" aria-label="Plan">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Plan</span>
  </button>
  <button class="tab" data-view="ideas" aria-label="Ideas">
    <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3Z"/></svg><span>Ideas</span>
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grabber"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>

<script src="app.js"></script>
</body>
</html>
